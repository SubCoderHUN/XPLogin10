; XPLogin10 - Luna "Welcome screen" theme.
;
; Metrics are in Windows XP's 1024x768 design units and are scaled uniformly to
; the real resolution at runtime, so you can tune against a 1024x768 screenshot
; and the result holds on a 4K panel.
;
; Everything here is optional: anything you leave out keeps the built-in
; default from src/ui/include/xplogin/ui/XpTheme.h.
;
; To match a screenshot precisely: take one of a real XP welcome screen at
; 1024x768, open both side by side, and adjust. Restart LogonUI (sign out) to
; see the change - or run xplogin-preview.exe /theme <this file> and skip the
; sign-out entirely.

[gradient.header]
; Top blue band, dark at the top edge, lightening towards the divider.
stop0 = 0.00, #00257A
stop1 = 0.55, #0840A8
stop2 = 1.00, #3A6EC8

[gradient.center]
; The main "welcome screen blue". #5A7EDC is the colour everyone remembers.
stop0 = 0.00, #5177D8
stop1 = 0.45, #5A7EDC
stop2 = 1.00, #4B71D2

[gradient.footer]
; The header ramp, mirrored.
stop0 = 0.00, #3A6EC8
stop1 = 0.45, #0840A8
stop2 = 1.00, #00257A

[gradient.dialog]
stop0 = 0.00, #4E77D6
stop1 = 1.00, #2C53AE

[colors]
dividerline      = #FFFFFF
centerdivider    = #80FFFFFF
primarytext      = #FFFFFF
secondarytext    = #C7D9F5
errortext        = #FFE48A
tilehover        = #33FFFFFF
tileselected     = #59FFFFFF
gobuttonouter    = #4CA82E
gobuttoninner    = #8AD65E
powerbuttonouter = #A81F1F
powerbuttoninner = #E25B4B
dialogshade      = #9A001A50

; ---------------------------------------------------------------------------
; [metrics] - deliberately absent.
;
; There used to be a full set of measurements here, and every one of them was
; wrong: they were read off a screenshot by eye before Microsoft's own numbers
; were recovered from the DirectUI markup inside XP's logonui.exe. The defaults
; in src/ui/include/xplogin/ui/XpTheme.h are that markup; this file was never
; brought into line with it, and because the file wins at run time, the
; installed screen was laid out from the guesses while every preview and test
; used the real numbers. That is why the two did not look the same.
;
; What the guesses did, for the record:
;   topbandheight   172 instead of 80   - a top band twice as tall as XP's
;   bottombandtop   620 instead of 700  - a bottom band twice as tall as XP's
;   instructiony    250 instead of 418  - "To begin, click your user name"
;                                         above the Windows logo instead of
;                                         below it, which is the wrong way round
;   tileheight       62 instead of 80, avatarsize 48 instead of 58, and so on
;
; So: no geometry here. Anything you add is an override of Microsoft's own
; layout, which is a thing you may well want - but it should be a decision,
; not an inheritance. The key names are the field names from XpMetrics,
; lower-cased.

[fonts]
; XP used Franklin Gothic Medium for the large text. It ships with Office and
; with most Windows installations; the fallback chain covers the rest.
heading      = Franklin Gothic Medium
body         = Tahoma
fallback     = Segoe UI
headingsize  = 24
usernamesize = 15
statussize   = 11
logosize     = 22

[strings]
; Translate the welcome screen here without rebuilding anything.
; The instruction in the left column, under the Windows logo. Set it empty to
; leave the column to the logo alone.
clickusername = To begin, click your user name
typepassword  = Type your password
turnoff       = Turn off computer
loggingon     = Loading your personal settings...
standby       = Stand By
turnoffbutton = Turn Off
restart       = Restart
cancel        = Cancel
hibernate     = Hibernate

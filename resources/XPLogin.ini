; XPLogin10 configuration.
;
; Installed next to XPLoginProvider.dll. The path is recorded in
; HKLM\SOFTWARE\XPLogin10\ConfigPath; edit either and restart LogonUI
; (sign out, or Win+L twice) to pick up changes.
;
; Every value below is the built-in default, so a missing or empty file
; behaves exactly like this one.

[general]
; Master switch. `xplogin-install /disable` also clears this.
enabled = true

; Hide the Windows credential tiles so only the XP screen is visible.
; Set to false while you are still testing: it leaves you a way in that does
; not depend on this project working.
filterotherproviders = true

; WHICH tiles get hidden. This is the setting that decides whether a machine
; can still be signed in to if something here goes wrong, so the default is
; the cautious one.
;
;   keepalternatives  (default) Replace the password tiles - the ones the XP
;                     screen stands in for - and leave PIN, Windows Hello,
;                     fingerprint, smartcard and any provider we do not
;                     recognise alone. The XP screen still owns the logon
;                     desktop; "Other ways to log on" in the bottom left (or
;                     Escape from the account list) steps aside to reach them.
;
;   replaceeverything Hide every other tile. Fully authentic, and genuinely
;                     risky: an account that signs in with a PIN and has no
;                     usable password CANNOT log on in this mode. Only choose
;                     it if every account on the machine has a real password
;                     and you have tested signing in with one.
;
;   keepeverything    Filter nothing. The XP tile appears alongside the
;                     Windows ones. Useful for a first run.
;
; Whatever this says, three things always hold: XPLogin never hides its own
; tile, it abandons filtering entirely if the plan would leave no way to sign
; in, and Safe Mode bypasses it completely.
signinoptions = keepalternatives

; Credential providers to keep visible no matter what, by CLSID. For a
; third-party MFA or smartcard tile that a machine cannot do without.
; Comma separated, braced GUIDs.
alwaysallowproviders =

; Draw the "Turn off computer" button. Windows policy
; (ShutdownWithoutLogon) still has the final say.
allowshutdown = true
; Send the user back to the tile list after this many wrong passwords.
; 0 = never (LSA's own lockout policy is unaffected either way).
maxfailedattempts = 0

; Empty = next to the DLL.
logpath =
; 0 = off, 1 = errors, 2 = info, 3 = debug
loglevel = 2

[users]
showdisabled = false
showdomain = true
; XP hid the built-in Administrator unless it was the only usable account.
showadministrator = false
showguest = false
showmicrosoftaccounts = true

; One account and no password: sign in without asking, and show XP's "welcome"
; for the whole of it instead of an account list nobody is meant to click.
; This is what both XP and Windows 10 do unprompted. Set to false for a
; one-tile screen that waits to be clicked.
autologonblankpassword = true

; Cap on the number of tiles; the list scrolls past this.
maxaccounts = 64
; Extra accounts to keep off the welcome screen, comma separated.
; The registry's SpecialAccounts\UserList is honoured as well.
hidden =

[ui]
; Path to the theme .ini. Empty = XPLogin.theme.ini next to the DLL.
theme =
; Folder searched for <username>.bmp / .png tile pictures.
avatardirectory =
defaultavatar =
animations = true
tileslidems = 220
; The "2 programs running" line under each name.
showstatusline = true
; The blue "?" button next to the green arrow.
showhintbutton = true

[sounds]
enabled = true
; Left empty, these resolve to the XP sounds the setup deployed next to the
; DLL - XPLogin-logon.wav and friends. Set a path to use your own, or set
; `enabled = false` for a silent logon screen. A file that is not there is
; skipped silently, so nothing here can stop somebody signing in.
logon    =
logoff   =
error    =
; XP played nothing when you picked an account, so this one is empty by
; default rather than pointing at a sound XP did not use.
click    =
shutdown =
volume   = 100

[safety]
; Crash-loop protection. Strikes accumulate every time the provider starts and
; reset on any successful sign-in.
enabled = true
; Strikes before the Windows tiles are shown alongside the XP screen.
unfilterthreshold = 2
; Strikes before the provider refuses to load at all.
bypassthreshold = 3
